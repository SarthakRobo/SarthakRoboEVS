<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <!-- App jaisa feel dene ke liye (zoom lock) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SarthakRobo EVS Class</title>
    
    <!-- PWA / App Download Links -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#f4f7f6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/static/images/sarthak.png">

    <style>
        body { 
            font-family: Arial, sans-serif; background-color: #f4f7f6; 
            text-align: center; padding: 15px; color: #0000FF; margin: 0;
        }
        #header { font-size: 26px; font-weight: bold; color: #333; margin-bottom: 20px; margin-top: 10px; }
        
        /* Photos Container */
        .photo-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .profile-pic { 
            width: 120px; 
            height: 120px; 
            object-fit: cover; 
            border-radius: 50%; 
            border: 4px solid #007bff; 
            transition: all 0.3s ease; 
        }
        
        /* Talking Animation */
        .talking { animation: bounceGlow 0.5s infinite alternate; }
        @keyframes bounceGlow {
            0% { transform: scale(1) translateY(0); box-shadow: 0 0 10px #007bff; }
            100% { transform: scale(1.1) translateY(-8px); box-shadow: 0 0 25px #28a745; }
        }

        #slide-container { 
            background: white; padding: 25px; border-radius: 10px; 
            border: 2px solid red; border-left: 8px solid red; 
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1); max-width: 800px; 
            margin: auto; min-height: 250px; display: none;
        }
        
        h1 { color: #d9534f; font-size: 24px; }
        #answer { font-size: 20px; line-height: 1.6; color: #0000FF; font-weight: bold; display: none; margin-top:20px; }
        
        .btn { 
            padding: 12px 25px; font-size: 18px; margin: 10px; cursor: pointer; 
            border: none; border-radius: 8px; font-weight: bold; color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:disabled { background-color: #cccccc; cursor: not-allowed; box-shadow: none; }
        
        #startBtn { background-color: #28a745; font-size: 22px; padding: 15px 30px; margin-top: 20px; }
        #actionBtn { background-color: #ff9800; font-size: 20px; width: 100%; margin-top:20px; }
        .nav-btn { background-color: #007bff; }
        .controls { margin-top: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div id="header">🤖 SarthakRobo EVS Teacher</div>
    
    <button id="startBtn" onclick="startClass()">▶ क्लास शुरू करें</button>

    <div id="slide-container">
        <div class="photo-container">
            <img class="profile-pic" id="pic1" src="/static/images/sarthak.png" alt="SarthakRobo">
            <img class="profile-pic" id="pic2" src="/static/images/sarthak2.png" alt="Jigar">
        </div>
        
        <h1 id="question">लोड हो रहा है...</h1>
        
        <button id="actionBtn" onclick="showAnswerAndPlay()">Show Answer & Play Audio</button>
        <p id="answer"></p>
        
        <div class="controls">
            <button id="prevBtn" class="btn nav-btn" onclick="changeSlide(-1)">◀ पिछला</button>
            <label style="font-size: 16px; color:#333; margin: 10px 0;">
                <input type="checkbox" id="autoPlayToggle" checked> Auto-Play
            </label>
            <button id="nextBtn" class="btn nav-btn" onclick="changeSlide(1)">अगला ▶</button>
        </div>
    </div>

    <audio id="audioPlayer" style="display:none;"></audio>

    <script>
        let currentSlide = 1;
        const totalSlides = {{ total_slides }};
        const audioPlayer = document.getElementById("audioPlayer");
        const pic1 = document.getElementById("pic1");
        const pic2 = document.getElementById("pic2");

        function startClass() {
            document.getElementById("startBtn").style.display = "none";
            document.getElementById("slide-container").style.display = "block";
            loadSlide(currentSlide);
        }

        function loadSlide(slideNum) {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            pic1.classList.remove("talking");
            pic2.classList.remove("talking");

            fetch(`/get_slide/${slideNum}`)
                .then(response => response.json())
                .then(data => {
                    if(data.error) return;
                    document.getElementById("question").innerText = data.question;
                    document.getElementById("answer").innerText = data.answer;
                    audioPlayer.src = data.audio;
                    
                    if(data.is_heading) {
                        document.getElementById("answer").style.display = "none";
                        document.getElementById("actionBtn").style.display = "none";
                        audioPlayer.play();
                    } else {
                        document.getElementById("answer").style.display = "none";
                        document.getElementById("actionBtn").style.display = "block";
                    }
                    
                    document.getElementById("prevBtn").disabled = (slideNum === 1);
                    document.getElementById("nextBtn").disabled = (slideNum === totalSlides);
                });
        }

        function showAnswerAndPlay() {
            document.getElementById("answer").style.display = "block";
            document.getElementById("actionBtn").style.display = "none";
            audioPlayer.play();
        }

        audioPlayer.onplay = function() {
            pic1.classList.add("talking");
            pic2.classList.add("talking");
        };
        audioPlayer.onpause = function() {
            pic1.classList.remove("talking");
            pic2.classList.remove("talking");
        };
        
        audioPlayer.onended = function() {
            pic1.classList.remove("talking");
            pic2.classList.remove("talking");
            let isAuto = document.getElementById("autoPlayToggle").checked;
            if(isAuto && currentSlide < totalSlides) {
                setTimeout(() => { changeSlide(1); }, 1500);
            }
        };

        function changeSlide(step) {
            let newSlide = currentSlide + step;
            if(newSlide >= 1 && newSlide <= totalSlides) {
                currentSlide = newSlide;
                loadSlide(currentSlide);
            }
        }
    </script>
</body>
</html>
