<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SarthakRobo AI Dashboard</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#f0f4f8">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8; margin: 0; padding: 0; 
            color: #333; text-align: center; box-sizing: border-box;
        }
        
        /* Views System */
        .view { display: none; padding: 15px; }
        .view.active { display: block; animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Dashboard Top Bar */
        .top-bar { background: #fff; padding: 15px; border-radius: 0 0 20px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .top-bar h1 { margin: 0; font-size: clamp(20px, 5vw, 24px); color: #007bff; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .top-bar img { width: 40px; border-radius: 50%; }

        /* Dashboard Cards */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 900px; margin: auto; }
        .card {
            background: #fff; border-radius: 20px; padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06); cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 2px solid transparent; text-align: left;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(0,0,0,0.12); }
        .card.evs { border-top: 5px solid #28a745; }
        .card.english { border-top: 5px solid #007bff; opacity: 0.7; }
        .card.maths { border-top: 5px solid #dc3545; opacity: 0.7; }
        .card h2 { margin: 0 0 10px 0; font-size: 22px; color: #333; }
        .card p { color: #666; font-size: 14px; margin-bottom: 15px; }
        .badge { background: #ffeeba; color: #856404; padding: 5px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge.coming-soon { background: #e2e3e5; color: #383d41; }

        /* Index Grid (Direct Jump) */
        .index-title { font-size: 18px; margin-bottom: 15px; color: #555; }
        .index-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); 
            gap: 10px; max-width: 800px; margin: auto; max-height: 65vh; 
            overflow-y: auto; padding: 5px;
        }
        .index-btn { 
            background: #fff; border: 2px solid #007bff; color: #007bff; 
            font-weight: bold; font-size: 16px; padding: 12px 0; 
            border-radius: 10px; cursor: pointer; transition: 0.2s; 
        }
        .index-btn:hover { background: #007bff; color: #fff; }

        /* Slide View Styles */
        #slide-container-box {
            background: white; padding: 20px; border-radius: 15px;
            border-top: 6px solid #d9534f; box-shadow: 0px 8px 20px rgba(0,0,0,0.1); 
            max-width: 800px; margin: auto; position: relative;
        }
        .photo-container { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; }
        .profile-pic { width: clamp(70px, 18vw, 110px); height: clamp(70px, 18vw, 110px); object-fit: cover; border-radius: 50%; border: 3px solid #007bff; transition: all 0.3s; }
        
        .talking { animation: bounceGlow 0.5s infinite alternate; }
        @keyframes bounceGlow { 0% { transform: scale(1) translateY(0); box-shadow: 0 0 10px #007bff; } 100% { transform: scale(1.1) translateY(-8px); box-shadow: 0 0 25px #28a745; } }

        h1.slide-q { color: #d9534f; font-size: clamp(18px, 4vw, 24px); margin: 10px 0; }
        #answer { font-size: clamp(16px, 3.5vw, 20px); line-height: 1.5; color: #0000FF; font-weight: bold; display: none; margin-top:15px; }

        .btn { padding: 10px 15px; font-size: clamp(14px, 3.5vw, 16px); cursor: pointer; border: none; border-radius: 8px; font-weight: bold; color: white; }
        .btn:disabled { background-color: #cccccc; cursor: not-allowed; }
        #actionBtn { background-color: #ff9800; width: 100%; margin-top:15px; padding: 12px; font-size: 18px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

        .controls { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .nav-btn { background-color: #007bff; flex: 1; padding: 12px 0; }

        .back-btn { background: #6c757d; margin-bottom: 10px; }
        .home-btn { position: absolute; top: 10px; right: 10px; background: #dc3545; padding: 5px 12px; border-radius: 5px; }
    </style>
</head>
<body>

    <!-- VIEW 1: Modern Dashboard -->
    <div id="view-dashboard" class="view active">
        <div class="top-bar">
            <h1><img src="/static/images/sarthak.png" alt="Logo"> SarthakRobo AI Educator</h1>
        </div>
        
        <div class="dashboard-grid">
            <div class="card evs" onclick="showIndex()">
                <h2>🌍 EVS Teacher</h2>
                <p>Science, Environment & Nature Chapters</p>
                <span class="badge">121 Slides Active</span>
            </div>
            <div class="card english" onclick="alert('English Teacher Module - Coming Soon for Exhibition!')">
                <h2>🔠 English Teacher</h2>
                <p>Grammar, Reading & Vocabulary</p>
                <span class="badge coming-soon">Coming Soon</span>
            </div>
            <div class="card maths" onclick="alert('Maths Teacher Module - Coming Soon for Exhibition!')">
                <h2>🔢 Maths Teacher</h2>
                <p>Logic, Puzzles & Calculations</p>
                <span class="badge coming-soon">Coming Soon</span>
            </div>
        </div>
    </div>

    <!-- VIEW 2: EVS Index (Direct Jump Grid) -->
    <div id="view-index" class="view">
        <div class="top-bar">
            <h1>🌍 EVS Chapter Index</h1>
            <button class="btn back-btn" onclick="showDashboard()">🏠 Back to Dashboard</button>
        </div>
        <p class="index-title">Select a Slide Number to Start:</p>
        <div class="index-grid" id="indexGrid">
            <!-- Buttons will be generated automatically by JavaScript -->
        </div>
    </div>

    <!-- VIEW 3: Slide Player (Main Class) -->
    <div id="view-slide" class="view">
        <div id="slide-container-box">
            <button class="btn home-btn" onclick="showIndex()">✖ Close</button>
            
            <div class="photo-container">
                <img class="profile-pic" id="pic1" src="/static/images/sarthak.png" alt="SarthakRobo">
                <img class="profile-pic" id="pic2" src="/static/images/sarthak2.png" alt="Jigar">
            </div>
            
            <h1 class="slide-q" id="question">Loading...</h1>
            
            <button id="actionBtn" class="btn" onclick="showAnswerAndPlay()">Show Answer & Play Audio</button>
            <p id="answer"></p>
            
            <div class="controls">
                <button id="prevBtn" class="btn nav-btn" onclick="changeSlide(-1)">◀ Prev</button>
                <label style="font-weight:bold; font-size:14px; color:#333;">
                    <input type="checkbox" id="autoPlayToggle" checked> Auto-Play
                </label>
                <button id="nextBtn" class="btn nav-btn" onclick="changeSlide(1)">Next ▶</button>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" style="display:none;"></audio>

    <script>
        let currentSlide = 1;
        const totalSlides = {{ total_slides }};
        let wakeLock = null; 

        // 🚀 FEATURE: Screen Wake Lock (No Sleep API)
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Screen Wake Lock is ACTIVE - Screen will not turn off.');
                }
            } catch (err) {
                console.error(`${err.name}, ${err.message}`);
            }
        }

        // 🚀 FEATURE: Auto-Generate 1 to 121 Buttons for Direct Jump
        function generateIndex() {
            const grid = document.getElementById("indexGrid");
            grid.innerHTML = "";
            for(let i=1; i<=totalSlides; i++) {
                let btn = document.createElement("button");
                btn.className = "index-btn";
                btn.innerText = i; 
                btn.onclick = function() { startClass(i); };
                grid.appendChild(btn);
            }
        }
        generateIndex();

        // --- View Switching Logic ---
        function showDashboard() {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-dashboard').classList.add('active');
            audioPlayer.pause();
        }

        function showIndex() {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-index').classList.add('active');
            audioPlayer.pause();
            requestWakeLock(); // Wake Lock ON when App Starts
        }

        function startClass(slideNum) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-slide').classList.add('active');
            currentSlide = slideNum;
            loadSlide(currentSlide);
            requestWakeLock(); // Wake Lock ON during class
        }

        // --- EVS Slide Audio & Data Logic ---
        const audioPlayer = document.getElementById("audioPlayer");
        const pic1 = document.getElementById("pic1");
        const pic2 = document.getElementById("pic2");

        function loadSlide(slideNum) {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            pic1.classList.remove("talking");
            pic2.classList.remove("talking");

            fetch(`/get_slide/${slideNum}`)
                .then(response => response.json())
                .then(data => {
                    if(data.error) return;
                    document.getElementById("question").innerText = data.question;
                    document.getElementById("answer").innerText = data.answer;
                    audioPlayer.src = data.audio;
                    
                    if(data.is_heading) {
                        document.getElementById("answer").style.display = "none";
                        document.getElementById("actionBtn").style.display = "none";
                        audioPlayer.play();
                    } else {
                        document.getElementById("answer").style.display = "none";
                        document.getElementById("actionBtn").style.display = "block";
                    }
                    
                    document.getElementById("prevBtn").disabled = (slideNum === 1);
                    document.getElementById("nextBtn").disabled = (slideNum === totalSlides);
                });
        }

        function showAnswerAndPlay() {
            document.getElementById("answer").style.display = "block";
            document.getElementById("actionBtn").style.display = "none";
            audioPlayer.play();
        }

        // Audio Animations
        audioPlayer.onplay = function() {
            pic1.classList.add("talking");
            pic2.classList.add("talking");
        };
        audioPlayer.onpause = function() {
            pic1.classList.remove("talking");
            pic2.classList.remove("talking");
        };
        
        audioPlayer.onended = function() {
            pic1.classList.remove("talking");
            pic2.classList.remove("talking");
            let isAuto = document.getElementById("autoPlayToggle").checked;
            if(isAuto && currentSlide < totalSlides) {
                setTimeout(() => { changeSlide(1); }, 1500);
            }
        };

        function changeSlide(step) {
            let newSlide = currentSlide + step;
            if(newSlide >= 1 && newSlide <= totalSlides) {
                currentSlide = newSlide;
                loadSlide(currentSlide);
            }
        }

        // Re-apply Wake Lock if screen is minimized and opened again
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                requestWakeLock();
            }
        });
    </script>
</body>
</html>
