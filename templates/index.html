<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SarthakRobo EVS Class</title>
    
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#f4f7f6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/static/images/sarthak.png">

    <style>
        body { 
            font-family: Arial, sans-serif; background-color: #f4f7f6; 
            text-align: center; padding: 10px; color: #0000FF; margin: 0;
            box-sizing: border-box;
        }
        /* स्मार्ट हेडर साइज़ */
        #header { font-size: clamp(20px, 5vw, 26px); font-weight: bold; color: #333; margin: 5px 0 15px 0; }
        
        /* फोटो कंटेनर */
        .photo-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        /* फोटो स्क्रीन के हिसाब से छोटी-बड़ी होगी */
        .profile-pic { 
            width: clamp(80px, 20vw, 120px); 
            height: clamp(80px, 20vw, 120px); 
            object-fit: cover; 
            border-radius: 50%; 
            border: 3px solid #007bff; 
            transition: all 0.3s ease; 
        }
        
        /* बाउंस एनीमेशन */
        .talking { animation: bounceGlow 0.5s infinite alternate; }
        @keyframes bounceGlow {
            0% { transform: scale(1) translateY(0); box-shadow: 0 0 10px #007bff; }
            100% { transform: scale(1.1) translateY(-8px); box-shadow: 0 0 25px #28a745; }
        }

        /* मेन बॉक्स */
        #slide-container { 
            background: white; padding: 15px; border-radius: 10px; 
            border: 2px solid red; border-left: 8px solid red; 
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1); max-width: 800px; 
            width: 95%; margin: auto; display: none; box-sizing: border-box;
        }
        
        h1 { color: #d9534f; font-size: clamp(18px, 4vw, 24px); margin: 10px 0; }
        #answer { font-size: clamp(16px, 3.5vw, 20px); line-height: 1.5; color: #0000FF; font-weight: bold; display: none; margin-top:15px; }
        
        /* स्मार्ट बटन */
        .btn { 
            padding: 10px 15px; font-size: clamp(14px, 3.5vw, 18px); cursor: pointer; 
            border: none; border-radius: 8px; font-weight: bold; color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:disabled { background-color: #cccccc; cursor: not-allowed; box-shadow: none; }
        
        #startBtn { background-color: #28a745; font-size: 20px; padding: 15px 30px; margin-top: 20px; }
        #actionBtn { background-color: #ff9800; width: 100%; margin-top:15px; padding: 12px; font-size: clamp(16px, 4vw, 20px); }
        
        /* नीचे के कंट्रोल्स को एक लाइन में सेट करना */
        .controls { 
            margin-top: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 10px;
        }
        .nav-btn { background-color: #007bff; flex: 1; padding: 12px 0; }
        .auto-play-label { flex: 1; font-size: clamp(14px, 3.5vw, 16px); color:#333; font-weight: bold; }

        /* आड़े फोन (Landscape) के लिए खास सेटिंग ताकि कुछ न कटे */
        @media (max-height: 500px) {
            #header { margin: 2px 0 5px 0; font-size: 18px; }
            .profile-pic { width: 60px; height: 60px; border-width: 2px;}
            #slide-container { padding: 10px; margin-bottom: 10px; }
            h1 { font-size: 16px; margin: 5px 0;}
            #answer { font-size: 14px; margin-top: 5px; }
            .controls { margin-top: 10px; }
            .btn { padding: 8px; }
            #actionBtn { padding: 8px; margin-top: 10px;}
        }
    </style>
</head>
<body>

    <div id="header">🤖 SarthakRobo EVS Teacher</div>
    
    <button id="startBtn" onclick="startClass()">▶ क्लास शुरू करें</button>

    <div id="slide-container">
        <div class="photo-container">
            <img class="profile-pic" id="pic1" src="/static/images/sarthak.png" alt="SarthakRobo">
            <img class="profile-pic" id="pic2" src="/static/images/sarthak2.png" alt="Jigar">
        </div>
        
        <h1 id="question">लोड हो रहा है...</h1>
        
        <button id="actionBtn" onclick="showAnswerAndPlay()">Show Answer & Play Audio</button>
        <p id="answer"></p>
        
        <div class="controls">
            <button id="prevBtn" class="btn nav-btn" onclick="changeSlide(-1)">◀ पिछला</button>
            <label class="auto-play-label">
                <input type="checkbox" id="autoPlayToggle" checked> Auto-Play
            </label>
            <button id="nextBtn" class="btn nav-btn" onclick="changeSlide(1)">अगला ▶</button>
        </div>
    </div>

    <audio id="audioPlayer" style="display:none;"></audio>

    <script>
        let currentSlide = 1;
        const totalSlides = {{ total_slides }};
        const audioPlayer = document.getElementById("audioPlayer");
        const pic1 = document.getElementById("pic1");
        const pic2 = document.getElementById("pic2");

        function startClass() {
            document.getElementById("startBtn").style.display = "none";
            document.getElementById("slide-container").style.display = "block";
            loadSlide(currentSlide);
        }

        function loadSlide(slideNum) {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            pic1.classList.remove("talking");
            pic2.classList.remove("talking");

            fetch(`/get_slide/${slideNum}`)
                .then(response => response.json())
                .then(data => {
                    if(data.error) return;
                    document.getElementById("question").innerText = data.question;
                    document.getElementById("answer").innerText = data.answer;
                    audioPlayer.src = data.audio;
                    
                    if(data.is_heading) {
                        document.getElementById("answer").style.display = "none";
                        document.getElementById("actionBtn").style.display = "none";
                        audioPlayer.play();
                    } else {
                        document.getElementById("answer").style.display = "none";
                        document.getElementById("actionBtn").style.display = "block";
                    }
                    
                    document.getElementById("prevBtn").disabled = (slideNum === 1);
                    document.getElementById("nextBtn").disabled = (slideNum === totalSlides);
                });
        }

        function showAnswerAndPlay() {
            document.getElementById("answer").style.display = "block";
            document.getElementById("actionBtn").style.display = "none";
            audioPlayer.play();
        }

        audioPlayer.onplay = function() {
            pic1.classList.add("talking");
            pic2.classList.add("talking");
        };
        audioPlayer.onpause = function() {
            pic1.classList.remove("talking");
            pic2.classList.remove("talking");
        };
        
        audioPlayer.onended = function() {
            pic1.classList.remove("talking");
            pic2.classList.remove("talking");
            let isAuto = document.getElementById("autoPlayToggle").checked;
            if(isAuto && currentSlide < totalSlides) {
                setTimeout(() => { changeSlide(1); }, 1500);
            }
        };

        function changeSlide(step) {
            let newSlide = currentSlide + step;
            if(newSlide >= 1 && newSlide <= totalSlides) {
                currentSlide = newSlide;
                loadSlide(currentSlide);
            }
        }
    </script>
</body>
</html>
